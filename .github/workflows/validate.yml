name: Validate TSMM artifacts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema referencing pyyaml
      - name: Validate examples
        run: python scripts/validate_examples.py
      - name: Validate bindings
        run: python scripts/validate_bindings.py
      - name: Validate test vectors
        run: python scripts/validate_test_vectors.py
      - name: Validate YAML models
        run: python scripts/validate_yaml_models.py
      - name: Validate graph
        run: python scripts/validate_tsmm_graph.py
      - name: Validate registry
        run: python scripts/validate_tsmm_registry.py
      - name: Check docs
        run: python scripts/check_docs.py
      - name: Check schema coverage
        run: python scripts/check_schema_coverage.py
