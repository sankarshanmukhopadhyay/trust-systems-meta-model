title: Trust Systems Meta Model
description: Canonical semantic and graph model for governed trust systems
url: https://sankarshanmukhopadhyay.github.io
baseurl: /trust-systems-meta-model
remote_theme: just-the-docs/just-the-docs@v0.10.1
markdown: kramdown

# Apply the Just The Docs chrome to every normal Jekyll page.
# Without this default, pages with front matter but no explicit layout are
# converted to bare HTML fragments and bypass the theme sidebar, header,
# breadcrumbs, search assets, and responsive styling.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

search_enabled: true
heading_anchors: true
color_scheme: light
aux_links:
  "View on GitHub":
    - "https://github.com/sankarshanmukhopadhyay/trust-systems-meta-model"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links
exclude:
  - node_modules/
  - vendor/
  - tools/
  - scripts/
  - tests/
  - validation/
  - artifacts/
  - .github/
  - Gemfile
  - Gemfile.lock

relative_links:
  enabled: true
  collections: true
